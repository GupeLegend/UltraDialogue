# ==================================================================================
#  TEMPLATE - copy it, rename it (the file name is the id) and edit it.
#  Try it without an NPC:  /ud open example
# ==================================================================================

# Shown at the top of the screen. A node can change it with its own "speaker:".
name: '&b&lThe Example'

# FancyNpcs NPC names (the name used in /npc create, NOT the display name).
# Clicking one of these opens this dialogue INSTEAD of its FancyNpcs actions.
# Any other entity:  /tag @e[type=villager,limit=1,sort=nearest] add dialogue:example
npcs: []

# npc | player:Name | texture:<base64> | item:MATERIAL | none      ("|" = fallback)
portrait: 'npc | item:WRITABLE_BOOK'

# Sound every time it speaks (optional; otherwise talk-sound from config.yml).
sound: 'entity.villager.ambient 0.6 1.2'

# Buttons per row (optional; otherwise screen.columns from config.yml).
columns: 1

# Where the talk starts: the first rule that matches. A single "start: node" works too.
start:
  - if: '!flag:example_seen'
    node: first_time
  - node: menu

nodes:

  first_time:
    # Actions that run as soon as the node is shown.
    on-show:
      - 'flag: example_seen'
    text:
      - 'Hello, &e%player%&f! This is the first time we talk.'
      - 'Next time I will greet you differently.'
    # No answers + "next" = a single "Continue" button.
    next: menu

  menu:
    text: 'How can I help you?'
    answers:
      # "icon": a built-in icon before the text (/ud icons lists them).
      # "size": 1 (20px), 2 (98px), 3 (150px) or 4 (204px); or "width: N" for an exact width.
      - text: '&aWhat can you do?'
        icon: story
        tooltip: '&7Hover text.'
        goto: explanation

      - text: '&eRun /spawn'
        actions:
          - 'command: spawn'

      # "if" hides the answer when it doesn't match. Every line = AND. "||" = OR.
      - text: '&6VIP only'
        if:
          - 'permission:group.vip || permission:ultradialogue.admin'
        actions:
          - 'message: &6You are VIP!'
          - 'sound: ENTITY_PLAYER_LEVELUP'

      - text: '&dTalk to the merchant'
        actions:
          - 'dialogue: merchant'

      - text: '&6Locked answers (1.1.2)'
        goto: locks

      - text: '&6Free rows: 1-2-2-1 (1.1.2)'
        goto: rows

      - text: '&8Goodbye'
        goto: end

  # 1.1.2: a node with locked answers, Back and a fixed Exit. Try: /ud open example locks
  locks:
    # Heading of this screen only (the speaker stays the same).
    title: '&6The Example''s secrets'
    text: 'Some of these open up as we become friends.'
    columns: 2
    answers:
      - text: '&aAn easy one'
        icon: quest side
        size: 2
        goto: explanation
      # "locked": when the "if" fails the answer shows greyed out instead of hidden,
      # and clicking it only shows this text in the action bar. "locked: true" = default text.
      - text: '&aA secret'
        icon: quest riddle
        size: 2
        if: 'affinity >= 10'
        locked: '&7Talk to me a bit more first.'
        goto: explanation
      - text: '&aA rumour'
        icon: story
        size: 2
        goto: explanation
      # "size: 4" in a 2-column screen = moved to the last row, alone and centred.
      - text: '&7Tell me everything'
        size: 4
        goto: explanation
    # "back" = previous screen, "exit" = fixed button at the very bottom.
    # Any full answer works too (a "Reward" with its actions).
    nav:
      - back
      - exit

  # 1.1.2: free rows. Minecraft's own grid can't mix a wide row with split rows; "layout" draws
  # the buttons as clickable text so every row can have its own count. Try: /ud open example rows
  rows:
    title: '&6Any shape you want'
    text: 'One wide, two and two, one wide.'
    # Buttons per row, top to bottom. Leftover answers go one per row.
    layout: [1, 2, 2, 1]
    answers:
      # Several icons on one button: "quest main" = ! plus the green identifier.
      - {text: '&fMain quest', icon: quest main, goto: explanation}
      - {text: '&fSide quest', icon: quest side, goto: explanation}
      - {text: '&fSide quest', icon: quest side, goto: explanation}
      - {text: '&fA riddle', icon: quest riddle, if: 'affinity >= 10', locked: '&7Not yet.', goto: explanation}
      - {text: '&fA story', icon: story, goto: explanation}
      - {text: '&730% chance of a gift', icon: chance, goto: menu}
    # With "layout", nav buttons are REAL buttons on one row, in this order.
    nav:
      - back
      - {text: '&eReward', icon: reward, actions: ['message: &eReward claimed!'], goto: rows}
      - exit

  explanation:
    # Another character can take the word in a node.
    speaker: '&7&oA distant voice'
    text:
      - 'Each answer can:'
      - '&7• go to another node  • open a menu'
      - '&7• run commands  • play sounds, titles, messages'
      - '&7• flag the player and change what they hear next time'
    answers:
      - text: '&7« Back'
        goto: menu
      - text: '&cForget we ever talked'
        actions:
          - 'unflag: example_seen'
          - 'actionbar: &7Flag removed.'
        goto: end
