name: UltraDialogue
version: '1.1.4'
main: mc.gupe.ultradialogue.UltraDialogue
api-version: '26.1'
author: Social Studio
description: NPC dialogue screens with branching answers, conditions and actions - native Minecraft dialogs, no resource pack.
website: https://gupe.dev/en/wiki/ultradialogue/
folia-supported: true
# All OPTIONAL. Listed as softdepend so they load first and the hooks can find them.
#   FancyNpcs      -> clicking an NPC opens its dialogue
#   PlaceholderAPI -> %placeholders% in texts, actions and conditions
#   DeluxeMenus    -> the "menu:" action
#   ViaVersion     -> clients < 1.21.6 get the dialogue in chat instead
#   BeautyQuests   -> ULTRADIALOGUE stage, "quest:" actions and conditions
#   floodgate      -> Bedrock players always get the text buttons (Bedrock can't draw the pack's)
softdepend: [FancyNpcs, PlaceholderAPI, DeluxeMenus, ViaVersion, BeautyQuests, floodgate]
# Loads before the plugins that build the server's resource pack, so the buttons it installs in
# them are read on the same boot.
loadbefore: [ResourcePackManager, Nexo, Oraxen, ItemsAdder, CraftEngine, EcoItems]

commands:
  ultradialogue:
    description: Manage NPC dialogues and edit their buttons.
    aliases: [ud, dialogue, dialogo]
    permission: ultradialogue.admin
    usage: |
      /ud [editor]                        open the button editor
      /ud open <id> [player] [node]
      /ud reload
      /ud list
      /ud flags <player> [clear [flag]]
      /ud affinity <player> [id] [set|add|reset] [n]
      /ud icons

permissions:
  ultradialogue.admin:
    description: Open, reload and manage dialogues, including the button editor.
    default: op

  # Node from the plugin's previous name ("Dialogos"), kept for compatibility.
  dialogos.admin:
    default: false
    children: { ultradialogue.admin: true }
